version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/ARFastSNTP"
      - "/src/ARFastSNTP.Studio"
      - "/src/ARFastSNTP.Dashboard"
      - "/src/ARFastSNTP.Setup"
      - "/tests/ARFastSNTP.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
