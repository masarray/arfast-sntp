name: Bug report
description: Tell us what happened so we can help improve AR Fast SNTP
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Thanks for trying AR Fast SNTP! Please remove personal or private network information from screenshots and logs. For security issues, see SECURITY.md."
  - type: input
    id: version
    attributes:
      label: AR Fast SNTP version
      description: Find it on the GitHub release you downloaded.
      placeholder: "e.g. v0.10.4"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11 x64, or Ubuntu desktop x64"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce this?
      placeholder: "1. Open AR Fast SNTP\n2. Add a server IP\n3. ..."
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or error message (optional)
      description: Please hide private IP addresses, hostnames, and site details.
