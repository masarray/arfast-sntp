name: Windows CI
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**', '.github/workflows/windows-ci.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'tools/**', '.github/workflows/windows-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build worker, tests and dashboard
        run: |
          dotnet build tests/ARFastSNTP.Tests/ARFastSNTP.Tests.csproj -c Release --warnaserror
          dotnet build src/ARFastSNTP.Dashboard/ARFastSNTP.Dashboard.csproj -c Release --warnaserror
      - name: Deterministic SNTP regression suite
        run: dotnet run --project tests/ARFastSNTP.Tests/ARFastSNTP.Tests.csproj -c Release --no-build
      - name: Validate configuration without network or clock changes
        run: dotnet run --project src/ARFastSNTP/ARFastSNTP.csproj -c Release --no-build -- --server 192.16.1.175 --server-year 2026 --certification-mode --allow-step --check-config
      - name: Parse-check setup scripts without executing installation
        shell: pwsh
        run: |
          foreach ($file in @('tools/install.ps1', 'tools/uninstall.ps1')) {
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              throw "PowerShell syntax invalid in $file : $($parseErrors -join '; ')"
            }
          }
      - name: Publish self-contained x64 binaries
        run: |
          dotnet publish src/ARFastSNTP/ARFastSNTP.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/worker
          dotnet publish src/ARFastSNTP.Dashboard/ARFastSNTP.Dashboard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/dashboard
      - name: Assemble installable Windows bundle
        shell: pwsh
        run: |
          Copy-Item tools/install.ps1,tools/uninstall.ps1,tools/install-monitor.cmd,tools/install-certification-lab.cmd,tools/uninstall.cmd publish/
          Copy-Item docs/LAB-ACCEPTANCE.md publish/
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: ARFastSNTP-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 14
