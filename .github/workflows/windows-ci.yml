name: Windows CI
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'installer/**', 'tools/**', 'LICENSE', 'NOTICE', '.github/workflows/windows-ci.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'installer/**', 'tools/**', 'LICENSE', 'NOTICE', '.github/workflows/windows-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build worker, regression harness, GUI and setup
        shell: pwsh
        run: |
          $projects = @(
            'tests/ARFastSNTP.Tests/ARFastSNTP.Tests.csproj',
            'src/ARFastSNTP.Dashboard/ARFastSNTP.Dashboard.csproj',
            'src/ARFastSNTP.Setup/ARFastSNTP.Setup.csproj',
            'src/ARFastSNTP.Studio/ARFastSNTP.Studio.csproj'
          )
          foreach ($project in $projects) {
            dotnet build $project -c Release --warnaserror
            if ($LASTEXITCODE -ne 0) {
              throw "Fail-fast: build failed for $project (exit $LASTEXITCODE)"
            }
          }
      - name: SNTP regression and offline setup argument tests
        shell: pwsh
        run: |
          dotnet run --project tests/ARFastSNTP.Tests/ARFastSNTP.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'SNTP regression test failed' }
          dotnet run --project src/ARFastSNTP.Setup/ARFastSNTP.Setup.csproj -c Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Graphical setup argument test failed' }
          dotnet run --project src/ARFastSNTP.Setup/ARFastSNTP.Setup.csproj -c Release --no-build -- --inno-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Inno service lifecycle self-test failed' }
      - name: Worker no-network preflight and lifecycle smoke test
        shell: pwsh
        run: |
          dotnet run --project src/ARFastSNTP/ARFastSNTP.csproj -c Release --no-build -- --server 192.16.1.175 --server-year 2026 --certification-mode --allow-step --check-config
          if ($LASTEXITCODE -ne 0) { throw 'Worker configuration check failed' }
          $worker = Join-Path $PWD 'src/ARFastSNTP/bin/Release/net8.0/ARFastSNTP.exe'
          $statusFile = Join-Path $env:TEMP ("arfast-sntp-smoke-" + [guid]::NewGuid().ToString('N') + '.json')
          $process = Start-Process -FilePath $worker -ArgumentList @(
            '--server','127.0.0.1','--server-year','2026',
            '--status-file', $statusFile) -PassThru -WindowStyle Hidden
          try {
            $created = $false
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Milliseconds 400
              if (Test-Path -LiteralPath $statusFile) { $created = $true; break }
              if ($process.HasExited) { throw "Worker exited unexpectedly: $($process.ExitCode)" }
            }
            if (-not $created) { throw 'Worker did not produce status in 10 seconds' }
            $status = Get-Content -LiteralPath $statusFile -Raw | ConvertFrom-Json
            if ($status.StepEnabled) { throw 'Monitor worker unexpectedly has clock stepping enabled' }
            if ($status.Server -ne '127.0.0.1') { throw 'Wrong status server' }
            if ($status.RequestCount -lt 1) { throw 'Worker issued no SNTP requests' }
            if ($process.HasExited) { throw 'Worker unexpectedly stopped' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            $process.Dispose()
            Remove-Item -LiteralPath $statusFile -ErrorAction SilentlyContinue
          }
      - name: Publish standalone Windows executables
        run: |
          dotnet publish src/ARFastSNTP/ARFastSNTP.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/worker
          dotnet publish src/ARFastSNTP.Setup/ARFastSNTP.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o setup-build
          dotnet publish src/ARFastSNTP.Studio/ARFastSNTP.Studio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/studio
      - name: Validate lean Windows installer payload
        shell: pwsh
        run: |
          Copy-Item setup-build/ARFastSNTP.Setup.exe publish/
          foreach ($path in @(
            'publish/worker/ARFastSNTP.exe',
            'publish/studio/ARFastSNTP.Studio.exe',
            'publish/ARFastSNTP.Setup.exe',
            'LICENSE',
            'NOTICE',
            'docs/DESIGN-TOKEN-PROVENANCE.md'
          )) {
            if (-not (Test-Path $path)) { throw "Installer payload missing: $path" }
          }
          $xaml = Get-Content 'src/ARFastSNTP.Studio/MainWindow.axaml' -Raw
          if ($xaml.Contains('InstallSync_OnClick') -or
              $xaml.Contains('x:Name="YearInput"') -or
              $xaml.Contains('Content="+ Add server"')) {
            throw 'Compact monitor must not expose installer/era/placeholder controls'
          }
          if (-not $xaml.Contains('HistoryScroll') -or
              -not $xaml.Contains('PeerBroadcast') -or
              -not $xaml.Contains('PcClock') -or
              -not $xaml.Contains('ServerIcon') -or
              -not $xaml.Contains('SourceTrack') -or
              -not $xaml.Contains('SourceThumb') -or
              -not $xaml.Contains('ToggleSource_OnClick') -or
              -not $xaml.Contains('Text="PC TIME"') -or
              -not $xaml.Contains('Width="34" Height="19"')) {
            throw 'Compact monitor lost small switch, server icon or required sections'
          }
          if ($xaml.Contains('GlobalStatus') -or
              $xaml.Contains('SyncDetail') -or
              $xaml.Contains('LastReply') -or
              $xaml.Contains('x:Name="SwitchIcon"')) {
            throw 'Noisy status fields or oversized/obsolete controls returned'
          }
          $viewCode = Get-Content 'src/ARFastSNTP.Studio/MainWindow.axaml.cs' -Raw
          if (-not $viewCode.Contains('_serverIcon.Fill = enabled ? green : gray') -or
              -not $viewCode.Contains('if (!changed && _lastUnavailableKey is null)') -or
              -not $viewCode.Contains('if (!string.Equals(target.Text, value') -or
              -not $viewCode.Contains('SourceControlProtocol.SendAsync')) {
            throw 'Missing server color, status coalescing or real source IPC'
          }
          if ($viewCode.Contains('Verb = "runas"') -or
              $viewCode.Contains('Process.Start(') -or
              $viewCode.Contains('SourceServiceControl.SetEnabled')) {
            throw 'A source toggle must not launch a privileged helper or stop SCM service'
          }
          $poll = Get-Content 'src/ARFastSNTP/SyncWorker.cs' -Raw
          if (-not $poll.Contains('WaitUntilChangedAsync') -or
              -not $poll.Contains('TrySetTime') -or
              -not $poll.Contains('SourceEnabled = _source.Enabled')) {
            throw 'Worker lacks persisted NTP pause, correction barrier or status truth'
          }
          $wizard = Get-Content -LiteralPath 'installer/ARFastSNTP.iss' -Raw
          if (-not $wizard.Contains('Enter NTP Server IP Address') -or
              -not $wizard.Contains('FinishedHeadingLabel') -or
              -not $wizard.Contains('install-result.txt')) {
            throw 'Inno completion must distinguish service running from verified sync'
          }
          if (Test-Path 'publish/dashboard') {
            throw 'Old WinForms UI must not be bundled into the canonical installer'
          }
          Write-Host 'Installer payload verified; legacy WinForms remains source/build fallback.'

      - name: Compile standalone Inno Setup wizard
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --version=6.4.0 -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler installation failed' }
          }
          if (-not (Test-Path $compiler)) { throw "ISCC compiler is missing: $compiler" }
          & $compiler '/Qp' 'installer/ARFastSNTP.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno compiler failed ($LASTEXITCODE)" }
          $installer = 'installer-out/ARFastSNTP-Setup-Windows-x64.exe'
          if (-not (Test-Path $installer)) { throw 'Installer executable is missing' }
          $bytes = (Get-Item $installer).Length
          if ($bytes -lt 1000000) { throw "Suspiciously small installer: $bytes bytes" }
          Write-Host "Inno Setup compiled: $installer ($bytes bytes)"

      - name: Upload single Windows setup executable
        uses: actions/upload-artifact@v4
        with:
          name: ARFastSNTP-Inno-Windows-x64
          path: |
            installer-out/ARFastSNTP-Setup-Windows-x64.exe
            LICENSE
            NOTICE
            docs/START-HERE.txt
            docs/INSTALLER-UX-ACCEPTANCE.md
          if-no-files-found: error
          retention-days: 14
