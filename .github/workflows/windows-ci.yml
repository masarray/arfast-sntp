name: Windows CI
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**', '.github/workflows/windows-ci.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'tools/**', '.github/workflows/windows-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build worker, tests and dashboard
        run: |
          dotnet build tests/ARFastSNTP.Tests/ARFastSNTP.Tests.csproj -c Release --warnaserror
          dotnet build src/ARFastSNTP.Dashboard/ARFastSNTP.Dashboard.csproj -c Release --warnaserror
      - name: Deterministic SNTP regression suite
        run: dotnet run --project tests/ARFastSNTP.Tests/ARFastSNTP.Tests.csproj -c Release --no-build
      - name: Validate configuration without network or clock changes
        run: dotnet run --project src/ARFastSNTP/ARFastSNTP.csproj -c Release --no-build -- --server 192.16.1.175 --server-year 2026 --certification-mode --allow-step --check-config
      - name: Parse-check setup scripts without executing installation
        shell: pwsh
        run: |
          foreach ($file in @('tools/install.ps1', 'tools/uninstall.ps1')) {
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              throw "PowerShell syntax invalid in $file : $($parseErrors -join '; ')"
            }
          }
      - name: Smoke test monitor worker lifecycle without NTP network access
        shell: pwsh
        run: |
          $worker = Join-Path $PWD 'src/ARFastSNTP/bin/Release/net8.0/ARFastSNTP.exe'
          $snapshotFile = Join-Path $env:TEMP ("arfast-sntp-smoke-" + [guid]::NewGuid().ToString('N') + '.json')
          if (-not (Test-Path $worker)) { throw "Missing worker executable: $worker" }
          $process = Start-Process -FilePath $worker -ArgumentList @(
            '--server','127.0.0.1','--server-year','2026',
            '--status-file', $snapshotFile) -PassThru -WindowStyle Hidden
          try {
            $created = $false
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Milliseconds 400
              if (Test-Path $snapshotFile) { $created = $true; break }
              if ($process.HasExited) { throw "Worker stopped unexpectedly: exit $($process.ExitCode)" }
            }
            if (-not $created) { throw "Worker failed to produce a status snapshot within 10 seconds" }
            $status = Get-Content -LiteralPath $snapshotFile -Raw | ConvertFrom-Json
            if ($status.Server -ne '127.0.0.1') { throw "Wrong SNTP server in snapshot" }
            if ($status.StepEnabled) { throw "Monitor-only worker unexpectedly enabled time stepping!" }
            if ($status.RequestCount -lt 1) { throw "No SNTP requests made" }
            if ($process.HasExited) { throw "Monitor worker exited after producing status" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            $process.Dispose()
            Remove-Item -LiteralPath $snapshotFile -ErrorAction SilentlyContinue
          }
      - name: Publish self-contained x64 binaries
        run: |
          dotnet publish src/ARFastSNTP/ARFastSNTP.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/worker
          dotnet publish src/ARFastSNTP.Dashboard/ARFastSNTP.Dashboard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/dashboard
      - name: Verify CMD wrappers are resilient to missing PATH
        shell: pwsh
        run: |
          foreach ($file in @('tools/install-monitor.cmd', 'tools/install-certification-lab.cmd', 'tools/uninstall.cmd')) {
            if (-not (Select-String -LiteralPath $file -Pattern '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe' -SimpleMatch)) {
              throw "Missing absolute Windows PowerShell path in $file"
            }
          }
      - name: Assemble installable Windows bundle
        shell: pwsh
        run: |
          Copy-Item tools/install.ps1,tools/uninstall.ps1,tools/install-monitor.cmd,tools/install-certification-lab.cmd,tools/uninstall.cmd publish/
          Copy-Item docs/LAB-ACCEPTANCE.md,docs/START-HERE.txt publish/
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: ARFastSNTP-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 14
