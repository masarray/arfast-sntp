name: Windows CI
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'installer/**', 'tools/**', 'LICENSE', 'NOTICE', '.github/workflows/windows-ci.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'installer/**', 'tools/**', 'LICENSE', 'NOTICE', '.github/workflows/windows-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build worker, regression harness, GUI and setup
        run: |
          dotnet build tests/ARFastSNTP.Tests/ARFastSNTP.Tests.csproj -c Release --warnaserror
          dotnet build src/ARFastSNTP.Dashboard/ARFastSNTP.Dashboard.csproj -c Release --warnaserror
          dotnet build src/ARFastSNTP.Setup/ARFastSNTP.Setup.csproj -c Release --warnaserror
          dotnet build src/ARFastSNTP.Studio/ARFastSNTP.Studio.csproj -c Release --warnaserror
      - name: SNTP regression and offline setup argument tests
        shell: pwsh
        run: |
          dotnet run --project tests/ARFastSNTP.Tests/ARFastSNTP.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'SNTP regression test failed' }
          dotnet run --project src/ARFastSNTP.Setup/ARFastSNTP.Setup.csproj -c Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Graphical setup argument test failed' }
          dotnet run --project src/ARFastSNTP.Setup/ARFastSNTP.Setup.csproj -c Release --no-build -- --inno-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Inno service lifecycle self-test failed' }
      - name: Worker no-network preflight and lifecycle smoke test
        shell: pwsh
        run: |
          dotnet run --project src/ARFastSNTP/ARFastSNTP.csproj -c Release --no-build -- --server 192.16.1.175 --server-year 2026 --certification-mode --allow-step --check-config
          if ($LASTEXITCODE -ne 0) { throw 'Worker configuration check failed' }
          $worker = Join-Path $PWD 'src/ARFastSNTP/bin/Release/net8.0/ARFastSNTP.exe'
          $statusFile = Join-Path $env:TEMP ("arfast-sntp-smoke-" + [guid]::NewGuid().ToString('N') + '.json')
          $process = Start-Process -FilePath $worker -ArgumentList @(
            '--server','127.0.0.1','--server-year','2026',
            '--status-file', $statusFile) -PassThru -WindowStyle Hidden
          try {
            $created = $false
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Milliseconds 400
              if (Test-Path -LiteralPath $statusFile) { $created = $true; break }
              if ($process.HasExited) { throw "Worker exited unexpectedly: $($process.ExitCode)" }
            }
            if (-not $created) { throw 'Worker did not produce status in 10 seconds' }
            $status = Get-Content -LiteralPath $statusFile -Raw | ConvertFrom-Json
            if ($status.StepEnabled) { throw 'Monitor worker unexpectedly has clock stepping enabled' }
            if ($status.Server -ne '127.0.0.1') { throw 'Wrong status server' }
            if ($status.RequestCount -lt 1) { throw 'Worker issued no SNTP requests' }
            if ($process.HasExited) { throw 'Worker unexpectedly stopped' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            $process.Dispose()
            Remove-Item -LiteralPath $statusFile -ErrorAction SilentlyContinue
          }
      - name: Publish standalone Windows executables
        run: |
          dotnet publish src/ARFastSNTP/ARFastSNTP.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/worker
          dotnet publish src/ARFastSNTP.Dashboard/ARFastSNTP.Dashboard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/dashboard
          dotnet publish src/ARFastSNTP.Setup/ARFastSNTP.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o setup-build
          dotnet publish src/ARFastSNTP.Studio/ARFastSNTP.Studio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/studio
      - name: Assemble GUI setup bundle without PowerShell dependency
        shell: pwsh
        run: |
          Copy-Item setup-build/ARFastSNTP.Setup.exe publish/
          Copy-Item tools/install-sync.cmd,tools/install-monitor.cmd,tools/install-certification-lab.cmd,tools/uninstall.cmd publish/
          Copy-Item docs/LAB-ACCEPTANCE.md,docs/START-HERE.txt,docs/DESIGN-TOKEN-PROVENANCE.md publish/
          Copy-Item third_party/ARSSYUT-GPL-2.0-OR-LATER.txt publish/
          foreach ($file in @('publish/install-sync.cmd','publish/install-monitor.cmd','publish/uninstall.cmd')) {
            if (-not (Select-String -LiteralPath $file -Pattern 'ARFastSNTP.Setup.exe' -SimpleMatch)) {
              throw "Direct launcher missing graphical installer: $file"
            }
          }
          $legacy = Get-Content -LiteralPath 'publish/install-certification-lab.cmd' -Raw
          if (-not $legacy.Contains('install-sync.cmd')) {
            throw 'Compatibility shortcut must delegate to canonical install-sync.cmd'
          }
          foreach ($file in @('publish/install-sync.cmd','publish/install-monitor.cmd','publish/install-certification-lab.cmd','publish/uninstall.cmd')) {
            if (Select-String -LiteralPath $file -Pattern 'powershell.exe' -SimpleMatch) {
              throw "Wrapper must not depend on PowerShell: $file"
            }
          }
          $syncLauncher = Get-Content -LiteralPath 'publish/install-sync.cmd' -Raw
          if (-not $syncLauncher.Contains('--lab')) {
            throw 'Primary installer must request synchronization mode explicitly'
          }
          $monitorLauncher = Get-Content -LiteralPath 'publish/install-monitor.cmd' -Raw
          if (-not $monitorLauncher.Contains('--monitor-only')) {
            throw 'Diagnostic monitor wrapper must not silently enable clock stepping'
          }
          if (-not (Test-Path 'publish/studio/ARFastSNTP.Studio.exe')) {
            throw 'Avalonia Studio Windows executable missing from artifact'
          }
          foreach ($name in @('ArColors.axaml', 'ArTokens.axaml', 'ArTypography.axaml')) {
            if (-not (Test-Path (Join-Path 'src/ARFastSNTP.Studio/Design' $name))) {
              throw "Pinned Arssyut design token resource missing: $name"
            }
          }
          $setupExe = Join-Path $PWD 'publish/ARFastSNTP.Setup.exe'
          $verify = Start-Process -FilePath $setupExe -ArgumentList '--verify-package' -PassThru -Wait
          if ($verify.ExitCode -ne 0) {
            $errorFile = Join-Path $PWD 'publish/setup-validation-error.txt'
            if (Test-Path $errorFile) { Get-Content -LiteralPath $errorFile }
            Get-ChildItem publish -Recurse | Select-Object FullName,Length | Out-String | Write-Host
            throw "Offline Windows bundle verification failed (exit $($verify.ExitCode))"
          }
      - name: Compile standalone Inno Setup wizard
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --version=6.4.0 -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler installation failed' }
          }
          if (-not (Test-Path $compiler)) { throw "ISCC compiler is missing: $compiler" }
          & $compiler '/Qp' 'installer/ARFastSNTP.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno compiler failed ($LASTEXITCODE)" }
          $installer = 'installer-out/ARFastSNTP-Setup-Windows-x64.exe'
          if (-not (Test-Path $installer)) { throw 'Installer executable is missing' }
          $bytes = (Get-Item $installer).Length
          if ($bytes -lt 1000000) { throw "Suspiciously small installer: $bytes bytes" }
          Write-Host "Inno Setup compiled: $installer ($bytes bytes)"

      - name: Upload single Windows setup executable
        uses: actions/upload-artifact@v4
        with:
          name: ARFastSNTP-Inno-Windows-x64
          path: |
            installer-out/ARFastSNTP-Setup-Windows-x64.exe
            LICENSE
            NOTICE
            docs/START-HERE.txt
          if-no-files-found: error
          retention-days: 14
