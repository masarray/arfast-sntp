name: Publish v0.10.1 preview
# Deliberately runs only when the one-time publication workflow lands on main.
# Existing verified binary is reused; do NOT rebuild or adjust the machine clock.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-preview.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: arfast-sntp-preview-0.10.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'masarray/arfast-sntp'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: '38031763080'
      CI_SHA: 'ef23e4efa0905334c0a7f58c1b03a6573802ce3f'
      ARTIFACT_NAME: 'ARFastSNTP-Inno-Windows-x64'
      TAG: 'v0.10.1-preview.1'
      INSTALLER: 'ARFastSNTP-Setup-Windows-x64.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact successful Windows CI and unexpired artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'masarray/arfast-sntp' ]]
          result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.conclusion')"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.head_sha')"
          [[ "$result" == 'success' ]] || { echo "CI was not successful: $result"; exit 1; }
          [[ "$sha" == "$CI_SHA" ]] || { echo "CI SHA mismatch: $sha"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "ARFastSNTP-Inno-Windows-x64" and .expired == false) | .id' \
            | grep -Eq '^[0-9]+$' || { echo 'Pinned Actions artifact is missing or expired'; exit 1; }
          echo "Verified source $sha and artifact $ARTIFACT_NAME."

      - name: Materialize verified installer and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded release-assets
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" --dir downloaded
          mapfile -t files < <(find downloaded -type f -name "$INSTALLER")
          [[ "${#files[@]}" -eq 1 ]] || { echo "Expected exactly one $INSTALLER"; exit 1; }
          exe="${files[0]}"
          bytes="$(stat -c '%s' "$exe")"
          [[ "$bytes" -gt 10000000 ]] || { echo "Installer suspiciously small: $bytes"; exit 1; }
          mz="$(od -An -tx1 -N2 "$exe" | tr -d ' \n')"
          [[ "$mz" == '4d5a' ]] || { echo 'Installer is not a Windows PE executable'; exit 1; }
          cp "$exe" "release-assets/$INSTALLER"
          (cd release-assets && sha256sum "$INSTALLER" > "$INSTALLER.sha256")
          cat "release-assets/$INSTALLER.sha256"

      - name: Publish explicitly non-stable public pre-release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to change existing assets."
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease
            exit 0
          fi
          gh release create "$TAG" \
            "release-assets/$INSTALLER" "release-assets/$INSTALLER.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'AR Fast SNTP v0.10.1 Preview 1' \
            --notes-file docs/RELEASE-NOTES-0.10.1-preview.1.md \
            --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
